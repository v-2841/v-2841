name: activity

on:
  schedule:
    - cron: '8 */6 * * *'
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-writer

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Refresh the generated sections and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # Regenerate on top of whatever main looks like right now, so a
          # concurrent commit costs us a retry rather than a merge conflict.
          for attempt in 1 2 3; do
            git fetch --quiet origin main
            git reset --quiet --hard origin/main
            python scripts/update_activity.py
            git add README.md
            git diff --staged --quiet && exit 0
            git commit -q -m 'chore: refresh profile activity'
            git push --quiet && exit 0
            echo "push rejected on attempt $attempt, regenerating"
          done
          exit 1
