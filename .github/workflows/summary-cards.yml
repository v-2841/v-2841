name: summary cards

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          BRANCH_NAME: profile-summary-card-output
          UTC_OFFSET: 4
          # Templates and vendored assets would otherwise outrank the code.
          EXCLUDE: HTML,CSS,SCSS,Batchfile
          ANIMATION: rise
          DURATION: 1.2
