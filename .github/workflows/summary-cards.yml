name: summary cards

on:
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Every workflow here that commits to main shares one queue: the action below
# pushes the checked-out branch itself, so parallel runs reject each other.
concurrency:
  group: main-writer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate profile summary cards
        uses: vn7n24fzkq/github-profile-summary-cards@v0.12.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          USERNAME: ${{ github.repository_owner }}
          # The action pushes whatever branch is checked out; this input only
          # rewrites the links in its own preview file.
          BRANCH_NAME: main
          UTC_OFFSET: 4
          # Templates and vendored assets would otherwise outrank the code.
          EXCLUDE: HTML,CSS,SCSS,Batchfile
          ANIMATION: rise
          DURATION: 1.2
